<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#faf8ff" />
  <title>知期 · 经期记录原型</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="v2.css" />
</head>
<body>
  <main class="phone" aria-label="知期经期记录应用原型">
    <div class="statusbar"><span>9:41</span><span>● ◒</span></div>
    <section id="screen" class="screen"></section>
    <nav class="tabbar" aria-label="主导航">
      <button class="tab active" data-page="today" aria-label="今天"><span class="icon">⌂</span><span>今天</span></button>
      <button class="tab" data-page="calendar" aria-label="日历"><span class="icon">▦</span><span>日历</span></button>
      <button class="tab" data-page="trends" aria-label="趋势"><span class="icon">⌁</span><span>趋势</span></button>
      <button class="tab" data-page="profile" aria-label="我的"><span class="icon">○</span><span>我的</span></button>
    </nav>
  </main>

  <dialog id="recordDialog" class="sheet">
    <form method="dialog" id="recordForm">
      <header><button value="cancel" class="text-button">取消</button><h2 id="recordTitle">记录今天</h2><button value="save" class="text-button strong">保存</button></header>
      <div class="date-focus"><span id="recordDate">今天</span><small id="recordCycleDay">当前周期</small></div>
      <fieldset><legend>今天来经期了吗？</legend><div class="choice-row"><label><input type="radio" name="period" value="no" checked><span>没有</span></label><label><input type="radio" name="period" value="yes"><span>来了</span></label></div></fieldset>
      <fieldset id="flowFieldset"><legend>经量</legend><div class="choice-row"><label><input type="radio" name="flow" value="light"><span>少量</span></label><label><input type="radio" name="flow" value="medium"><span>适中</span></label><label><input type="radio" name="flow" value="heavy"><span>较多</span></label></div></fieldset>
      <fieldset class="product-fieldset"><legend>月经用品</legend><p class="field-help">记录这一天实际使用的数量</p><div class="product-counters">
        <div class="product-counter-wrap"><div class="product-counter"><div><b>月经巾</b><small>每日合计 · 张</small></div><div class="stepper"><button type="button" data-counter="pads" data-step="-1" aria-label="减少一张月经巾">−</button><input type="number" name="pads" value="0" min="0" max="50" inputmode="numeric" aria-label="月经巾使用张数"><button type="button" data-counter="pads" data-step="1" aria-label="增加一张月经巾">＋</button></div></div><div class="time-entry"><input id="padsTimeInput" type="time" aria-label="月经巾更换时间"><button type="button" data-add-time="pads">添加更换时间</button></div><div id="padsTimeList" class="time-list"></div></div>
        <div class="product-counter-wrap"><div class="product-counter"><div><b>月经棉条</b><small>每日合计 · 支</small></div><div class="stepper"><button type="button" data-counter="tampons" data-step="-1" aria-label="减少一支月经棉条">−</button><input type="number" name="tampons" value="0" min="0" max="50" inputmode="numeric" aria-label="月经棉条使用支数"><button type="button" data-counter="tampons" data-step="1" aria-label="增加一支月经棉条">＋</button></div></div><div class="time-entry"><input id="tamponsTimeInput" type="time" aria-label="月经棉条更换时间"><button type="button" data-add-time="tampons">添加更换时间</button></div><div id="tamponsTimeList" class="time-list"></div></div>
      </div></fieldset>
      <fieldset><legend>身体感受</legend><div class="chips"><label><input type="checkbox" name="symptoms" value="轻松"><span>轻松</span></label><label><input type="checkbox" name="symptoms" value="腹痛"><span>腹痛</span></label><label><input type="checkbox" name="symptoms" value="腰酸"><span>腰酸</span></label><label><input type="checkbox" name="symptoms" value="头痛"><span>头痛</span></label><label><input type="checkbox" name="symptoms" value="疲惫"><span>疲惫</span></label></div></fieldset>
      <fieldset><legend>心情</legend><div class="moods"><label><input type="radio" name="mood" value="平静"><span>🙂<small>平静</small></span></label><label><input type="radio" name="mood" value="愉快"><span>😊<small>愉快</small></span></label><label><input type="radio" name="mood" value="低落"><span>😔<small>低落</small></span></label><label><input type="radio" name="mood" value="烦躁"><span>😣<small>烦躁</small></span></label></div></fieldset>
      <label class="note"><span>备注</span><textarea name="note" placeholder="写下一些想记住的事…"></textarea></label>
      <div class="record-actions"><button type="button" id="continueToToday">连续记录到今天</button><button type="button" id="deleteRecord">删除这一天记录</button><button type="button" id="deletePeriod">删除整段经期</button></div>
    </form>
  </dialog>
  <dialog id="quickFlowDialog" class="confirm-dialog flow-dialog">
    <div class="confirm-icon">◔</div><h2>今天的经量如何？</h2><p>选择后会完成今天的经期记录，也可以稍后修改。</p>
    <div class="quick-flow-options"><button data-quick-flow="light">少量</button><button data-quick-flow="medium">适中</button><button data-quick-flow="heavy">较多</button><button data-quick-flow="">暂不记录</button></div>
    <button id="cancelQuickFlow" class="flow-cancel">取消</button>
  </dialog>
  <dialog id="noPeriodDialog" class="confirm-dialog">
    <div class="confirm-icon">✓</div>
    <h2>确认今天没有来吗？</h2>
    <p>确认后会记录为“今天没有来”，之后仍可随时修改。</p>
    <div class="confirm-actions"><button id="cancelNoPeriod">再想想</button><button id="confirmNoPeriod" class="confirm">确认没有来</button></div>
  </dialog>
  <input id="importFile" type="file" accept=".json,.xml,.pdf,application/json,text/xml,application/xml,application/pdf" hidden>
  <dialog id="importDialog" class="backup-dialog">
    <button class="dialog-close" id="closeImport" aria-label="关闭">×</button>
    <div class="backup-icon">⇩</div><h2>确认导入</h2>
    <p id="importFileName" class="backup-subtle"></p>
    <div id="importSummary" class="import-summary"></div>
    <div class="import-mode" role="group" aria-label="导入方式"><label><input type="radio" name="importMode" value="merge" checked><span>合并</span><small>保留当前记录，补充新数据</small></label><label><input type="radio" name="importMode" value="overwrite"><span>覆盖</span><small>相同日期以导入文件为准</small></label></div>
    <p class="privacy-note">文件只在当前设备中读取，不会上传到网络。导入前会自动保存一份可撤销快照。</p>
    <button id="confirmImport" class="backup-primary">确认导入</button>
  </dialog>
  <dialog id="cycleSettingsDialog" class="backup-dialog settings-dialog">
    <button class="dialog-close" id="closeCycleSettings" aria-label="关闭">×</button>
    <div class="backup-icon">⌁</div><h2>周期设置</h2>
    <p class="backup-subtle">调整预测基准，不会删除历史记录</p>
    <form id="cycleSettingsForm">
      <label class="settings-field">最近一次经期开始日<input id="lastPeriodStartInput" name="lastPeriodStart" type="date" required></label>
      <div class="settings-grid"><label class="settings-field">典型周期<input name="cycleLength" type="number" min="15" max="90" required><small>天</small></label><label class="settings-field">平均经期<input name="periodLength" type="number" min="1" max="15" required><small>天</small></label></div>
      <div class="cycle-list-head"><b>每次周期长度</b><small>取消勾选可排除异常周期</small></div>
      <div id="cycleIntervalList" class="cycle-interval-list"></div>
      <button class="backup-primary" type="submit">保存周期设置</button>
    </form>
  </dialog>
  <dialog id="exportDialog" class="backup-dialog">
    <button class="dialog-close" id="closeExport" aria-label="关闭">×</button>
    <div class="backup-icon">⇧</div><h2>导出与保存</h2>
    <p class="backup-subtle">选择适合手机保存或恢复数据的格式</p>
    <div class="export-options">
      <button data-export-format="markdown"><b>Markdown 报告</b><small>适合备忘录、笔记软件查看</small></button>
      <button data-export-format="pdf"><b>PDF 报告</b><small>打开打印界面后选择“存储为 PDF”</small></button>
      <button data-export-format="json"><b>JSON 完整备份</b><small>以后可重新导入本软件</small></button>
    </div>
  </dialog>
  <div id="toast" role="status">今天的记录已保存</div>
  <script src="pdf.worker.min.js"></script>
  <script src="pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
